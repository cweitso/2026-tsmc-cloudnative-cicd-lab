# ─────────────────────────────────────────────────────────────
# CI Pipeline — 114062545
# 設計理念：將 lint / typecheck / test / build 拆成獨立 job，
# 平行執行以縮短總耗時；任一 job 失敗即整體失敗。
# ─────────────────────────────────────────────────────────────
name: CI (114062545)

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  checks: write # dorny/test-reporter 需要此權限建立 Check Run
  actions: read # 讀取 workflow artifacts

concurrency:
  group: ci-114062545-${{ github.ref }}
  cancel-in-progress: true # 同 branch 新 push 自動取消舊 run

# ── 環境變數集中管理 ──
env:
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: TypeScript 型別檢查
  # ═══════════════════════════════════════════════════════════
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tsc --noEmit
        run: npm run typecheck

  # ═══════════════════════════════════════════════════════════
  # Job 2: Prettier 格式檢查
  # ═══════════════════════════════════════════════════════════
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check code formatting
        run: npm run format:check

  # ═══════════════════════════════════════════════════════════
  # Job 3: ESLint 靜態分析
  # ═══════════════════════════════════════════════════════════
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ═══════════════════════════════════════════════════════════
  # Job 4: 測試 + 覆蓋率 + 結果報告
  # ═══════════════════════════════════════════════════════════
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: |
          npx vitest run \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml \
            --coverage.enabled \
            --coverage.reporter=text \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory=coverage

      # 上傳 JUnit XML 為 artifact，方便下載檢視
      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 14

      # 上傳覆蓋率報告為 artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

      # 用 dorny/test-reporter 將測試結果顯示於 GitHub Actions 頁面
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results (Node ${{ matrix.node-version }})
          path: test-results/junit.xml
          reporter: java-junit

      # 將覆蓋率摘要寫入 GitHub Actions Job Summary
      - name: Write coverage to job summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Summary (Node ${{ matrix.node-version }})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Coverage |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|----------|" >> "$GITHUB_STEP_SUMMARY"

            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => s[m].pct + '%';
              const lines = [
                ['Statements', fmt('statements')],
                ['Branches',   fmt('branches')],
                ['Functions',  fmt('functions')],
                ['Lines',      fmt('lines')]
              ];
              lines.forEach(([m, v]) => console.log('| ' + m + ' | ' + v + ' |'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

  # ═══════════════════════════════════════════════════════════
  # Job 5: Docker Build 驗證
  # ═══════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typecheck, test] # 型別正確且測試通過才建 image
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=ci-${{ github.sha }} \
            -t my-app:ci-${{ github.run_number }} .

      - name: Smoke test container
        run: |
          docker run -d --name smoke \
            -p 3000:3000 \
            -e APP_VERSION=ci-${{ github.sha }} \
            my-app:ci-${{ github.run_number }}

          # 等待最多 30 秒直到 health check 通過
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "Health check passed"
              docker stop smoke
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed"
          docker logs smoke
          docker stop smoke
          exit 1

  # ═══════════════════════════════════════════════════════════
  # Job 6: 統整所有檢查結果 — branch protection 只需設這一個 job
  # ═══════════════════════════════════════════════════════════
  ci-gate:
    name: CI Gate (all checks)
    if: always()
    needs: [typecheck, prettier, eslint, test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "prettier:  ${{ needs.prettier.result }}"
          echo "eslint:    ${{ needs.eslint.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "docker:    ${{ needs.docker-build.result }}"

          if [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.prettier.result }}" != "success" ]] || \
             [[ "${{ needs.eslint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "::error::One or more CI checks failed"
            exit 1
          fi

          echo "All checks passed"
